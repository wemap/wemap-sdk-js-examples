<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wemap SDK - Examples Index</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #ffffff;
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      p {
        margin-bottom: 0.5rem;
      }

      a {
        color: #007bff;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .main-container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: #1a202c;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      .header p {
        font-size: 1rem;
        color: #4a5568;
      }

      /* Toolbar: search + tag filters */
      .toolbar {
        margin-bottom: 2rem;
      }

      .search-wrapper {
        position: relative;
        max-width: 520px;
        margin: 0 auto 1.25rem;
      }

      .search-input {
        width: 100%;
        padding: 0.75rem 2.5rem 0.75rem 1rem;
        font-size: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        color: #1a202c;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .search-input:focus {
        outline: none;
        border-color: #90cdf4;
        box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
      }

      .search-input::placeholder {
        color: #a0aec0;
      }

      .search-clear {
        position: absolute;
        right: 0.5rem;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #a0aec0;
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        display: none;
      }

      .search-clear:hover {
        color: #4a5568;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }

      .filter-chip {
        padding: 0.375rem 0.875rem;
        border-radius: 999px;
        font-size: 0.8125rem;
        font-weight: 500;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        color: #4a5568;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .filter-chip:hover {
        border-color: #cbd5e0;
      }

      .filter-chip.active {
        background: #1a202c;
        border-color: #1a202c;
        color: #ffffff;
      }

      .filter-chip .count {
        opacity: 0.6;
        margin-left: 0.375rem;
        font-variant-numeric: tabular-nums;
      }

      .example-pages {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .example-page-card {
        background: white;
        border-radius: 8px;
        padding: 1.5rem;
        border: 1px solid #e2e8f0;
        transition: border-color 0.2s ease;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
      }

      .example-page-card:hover {
        border-color: #cbd5e0;
      }

      .example-page-card h2 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
        color: #1a202c;
        font-weight: 600;
      }

      .example-page-card p {
        color: #4a5568;
        font-size: 0.9375rem;
        line-height: 1.6;
      }

      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-top: 1rem;
      }

      .card-footer {
        margin-top: auto;
        padding-top: 1rem;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .page-link {
        color: #4a5568;
        font-weight: 400;
        font-size: 0.875rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .page-link:hover {
        color: #2d3748;
      }

      .page-link::after {
        content: '→';
        transition: transform 0.2s ease;
      }

      .example-page-card:hover .page-link::after {
        transform: translateX(2px);
      }

      .badge {
        display: inline-block;
        padding: 0.25rem 0.625rem;
        border-radius: 4px;
        font-size: 0.6875rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: #f7fafc;
        color: #4a5568;
        border: 1px solid #e2e8f0;
      }

      /* Per-tag accent colors */
      .badge[data-tag='Map'] { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
      .badge[data-tag='Indoor'] { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
      .badge[data-tag='Markers'] { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
      .badge[data-tag='Location'] { background: #ecfeff; color: #155e75; border-color: #a5f3fc; }
      .badge[data-tag='GNSS'] { background: #ecfeff; color: #155e75; border-color: #a5f3fc; }
      .badge[data-tag='VPS'] { background: #ecfeff; color: #155e75; border-color: #a5f3fc; }
      .badge[data-tag='Routing'] { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
      .badge[data-tag='Navigation'] { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
      .badge[data-tag='Matching'] { background: #fffbeb; color: #92400e; border-color: #fde68a; }
      .badge[data-tag='Positioning'] { background: #fffbeb; color: #92400e; border-color: #fde68a; }
      .badge[data-tag='Combined'] { background: #fdf2f8; color: #9f1239; border-color: #fbcfe8; }

      .empty-state {
        text-align: center;
        color: #718096;
        padding: 3rem 1rem;
        font-size: 1rem;
      }

      /* Tablet styles */
      @media (min-width: 768px) {
        .example-pages {
          grid-template-columns: repeat(2, 1fr);
        }

        .header h1 {
          font-size: 3rem;
        }
      }

      /* Desktop styles */
      @media (min-width: 1024px) {
        .example-pages {
          grid-template-columns: repeat(3, 1fr);
        }

        body {
          padding: 3rem 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="header">
        <h1>Wemap SDK Examples</h1>
        <p>Interactive examples demonstrating SDK features and capabilities</p>
        <p>You can see the source code of the examples <a href="https://github.com/wemap/wemap-sdk-js-examples" target="_blank">here</a></p>
      </div>

      <div class="toolbar">
        <div class="search-wrapper">
          <input
            type="search"
            id="search"
            class="search-input"
            placeholder="Search examples…"
            autocomplete="off"
            aria-label="Search examples"
          />
          <button type="button" id="search-clear" class="search-clear" aria-label="Clear search">&times;</button>
        </div>
        <div class="filters" id="filters"></div>
      </div>

      <div class="example-pages" id="example-pages"></div>
      <p class="empty-state" id="empty-state" hidden>No examples match your search.</p>
    </div>

    <script>
      // Single source of truth for the examples index.
      // To add an example: append an entry here — no markup to copy.
      const EXAMPLES = [
        {
          href: 'map.html',
          title: 'Map & Indoor Levels',
          description:
            'Create a map with @wemap/map, listen to camera events, and switch indoor floors with setLevel.',
          tags: ['Map', 'Indoor'],
        },
        {
          href: 'viewport-pinpoints.html',
          title: 'Custom Markers from API Pinpoints',
          description:
            'Load pinpoints from the API (not the map style) with PinpointManager and render your own DomMarkerLayer markers for the ones in the viewport.',
          tags: ['Map', 'Markers'],
        },
        {
          href: 'combined.html',
          title: 'Combined Features (VPS)',
          description:
            'Test VPS location source, routing, and navigation features together in a unified interface.',
          tags: ['Combined', 'VPS', 'Routing', 'Navigation'],
        },
        {
          href: 'combined-gnss.html',
          title: 'Combined Features (GNSS)',
          description:
            'Test GNSS location source, routing, and navigation features together in a unified interface.',
          tags: ['Combined', 'GNSS', 'Routing', 'Navigation'],
        },
        {
          href: 'gnss-location-source.html',
          title: 'GNSS WiFi Location Source',
          description: 'Example demonstrating GNSS and WiFi-based location source functionality.',
          tags: ['Location', 'GNSS'],
        },
        {
          href: 'vps-location-source.html',
          title: 'VPS Location Source',
          description: 'Test Visual Positioning System (VPS) location source with camera-based positioning.',
          tags: ['Location', 'VPS'],
        },
        {
          href: 'map-matching.html',
          title: 'Map Matching',
          description:
            'Example demonstrating map matching functionality for aligning GPS coordinates with map paths.',
          tags: ['Matching', 'Positioning'],
        },
        {
          href: 'routing.html',
          title: 'Routing',
          description:
            'Example demonstrating routing and navigation features including route calculation and turn-by-turn directions.',
          tags: ['Routing', 'Navigation'],
        },
      ];

      const state = { query: '', activeTag: null };

      const pagesEl = document.getElementById('example-pages');
      const filtersEl = document.getElementById('filters');
      const emptyEl = document.getElementById('empty-state');
      const searchEl = document.getElementById('search');
      const clearEl = document.getElementById('search-clear');

      function matchesFilters(example) {
        const q = state.query.trim().toLowerCase();
        const matchesQuery =
          !q ||
          example.title.toLowerCase().includes(q) ||
          example.description.toLowerCase().includes(q) ||
          example.tags.some((t) => t.toLowerCase().includes(q));
        const matchesTag = !state.activeTag || example.tags.includes(state.activeTag);
        return matchesQuery && matchesTag;
      }

      function renderCards() {
        const visible = EXAMPLES.filter(matchesFilters);
        pagesEl.innerHTML = visible
          .map(
            (ex) => `
            <a href="${ex.href}" class="example-page-card">
              <h2>${ex.title}</h2>
              <p>${ex.description}</p>
              <div class="card-tags">
                ${ex.tags.map((t) => `<span class="badge" data-tag="${t}">${t}</span>`).join('')}
              </div>
              <div class="card-footer">
                <span class="page-link">Open page</span>
              </div>
            </a>`
          )
          .join('');
        emptyEl.hidden = visible.length > 0;
      }

      function renderFilters() {
        const counts = new Map();
        for (const ex of EXAMPLES) {
          for (const tag of ex.tags) {
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }
        const tags = [...counts.keys()].sort((a, b) => a.localeCompare(b));

        const allChip = `<button type="button" class="filter-chip${
          state.activeTag === null ? ' active' : ''
        }" data-tag="">All<span class="count">${EXAMPLES.length}</span></button>`;

        const tagChips = tags
          .map(
            (tag) => `<button type="button" class="filter-chip${
              state.activeTag === tag ? ' active' : ''
            }" data-tag="${tag}">${tag}<span class="count">${counts.get(tag)}</span></button>`
          )
          .join('');

        filtersEl.innerHTML = allChip + tagChips;
      }

      filtersEl.addEventListener('click', (event) => {
        const chip = event.target.closest('.filter-chip');
        if (!chip) return;
        const tag = chip.dataset.tag;
        state.activeTag = tag === '' ? null : tag;
        renderFilters();
        renderCards();
      });

      searchEl.addEventListener('input', () => {
        state.query = searchEl.value;
        clearEl.style.display = state.query ? 'block' : 'none';
        renderCards();
      });

      clearEl.addEventListener('click', () => {
        state.query = '';
        searchEl.value = '';
        clearEl.style.display = 'none';
        renderCards();
        searchEl.focus();
      });

      renderFilters();
      renderCards();
    </script>
  </body>
</html>
